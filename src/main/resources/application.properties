spring.application.name=sf-crud

server.port=${PORT:8080}

# Set these as environment variables; never commit Salesforce credentials.
salesforce.client-id=${SF_CLIENT_ID}
salesforce.client-secret=${SF_CLIENT_SECRET}
salesforce.redirect-uri=${SF_REDIRECT_URI:http://localhost:8080/oauth/callback}

salesforce.auth-url=https://login.salesforce.com/services/oauth2/authorize
salesforce.token-url=https://login.salesforce.com/services/oauth2/token
salesforce.api-version=v61.0
